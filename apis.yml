name: Pluton Biosciences
kind: company
description: >-
  Pluton Biosciences is a microbial discovery company that uses a proprietary
  Discovery Platform - high-throughput soil microbiome screening combined with
  computational analysis - to find naturally occurring microbial consortia for
  agriculture and carbon sequestration. Its lead product is a Biological
  Nitrogen System: photosynthetic microbial consortia that operate at the soil
  surface to fix atmospheric nitrogen and mobilize phosphorus. Pluton is a
  research-and-product company, not an API company; it has no public developer
  portal. Partnership and licensing inquiries are handled directly.
